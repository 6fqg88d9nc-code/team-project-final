<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Менің сүйікті әндерім</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🎵 Менің сүйікті әндерім</h1>
        <p>Көңіл көтеретін музыкалар жинағы</p>
    </header>

    <main class="playlist">
        <!-- 1-ән -->
        <div class="song-card">
            <div class="song-info">
                <h3>Көк тудың желбірегені</h3>
                <p>Орындаушы: Халық әні</p>
            </div>
            <button class="play-btn">Ойнату ▶</button>
        </div>

        <!-- 2-ән -->
        <div class="song-card">
            <div class="song-info">
                <h3>Думан</h3>
                <p>Орындаушы: Димаш Құдайберген</p>
            </div>
            <button class="play-btn">Ойнату ▶</button>
        </div>

        <!-- 3-ән -->
        <div class="song-card">
            <div class="song-info">
                <h3>Қара торғай</h3>
                <p>Орындаушы: Қайрат Нұртас</p>
            </div>
            <button class="play-btn">Ойнату ▶</button>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Зертханалық жұмыс. Барлық құқықтар қорғалған.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
